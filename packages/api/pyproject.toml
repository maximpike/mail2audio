[project]
name = "mail2audio-api"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "sqlalchemy",
    "uvicorn[standard]",
    "python-multipart",
    "google-auth-oauthlib",
    "google-api-python-client",
    "boto3",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-mock",
    "httpx",
    "coverage",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
